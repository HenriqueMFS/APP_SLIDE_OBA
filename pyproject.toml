# ==================== PYPROJECT.TOML ====================
# Configuração centralizada para ferramentas Python modernas
#
# Purpose: Configurar black, mypy, pytest, isort e metadata do projeto
# Clean Code Refactoring - Agent-CLEAN-16
# Created: 2025-11-19

[build-system]
# Requerimentos para build do projeto (futuro package)
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

# ==================== PROJECT METADATA ====================
[project]
name = "app-slide-oba"
version = "1.0.0"
description = "Gerador Automático de Apresentações PowerPoint a partir de dados de equipes"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "APP_SLIDE_OBA Team"}
]
keywords = ["powerpoint", "presentation", "automation", "docx", "pptx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Office/Business :: Office Suites",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

# --- Dependencies ---
dependencies = [
    "streamlit>=1.28.0",
    "python-docx>=0.8.11",
    "python-pptx>=0.6.21",
    "lxml>=4.9.0",
    "Pillow>=10.0.0",
]

# --- Optional Dependencies ---
[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
    "pylint>=2.17.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pre-commit>=3.3.0",
]

# ==================== BLACK (Code Formatter) ====================
[tool.black]
# Black: Formatador de código Python sem configuração (opinionated)
# "Any color you like, as long as it's black"

# --- Line Length ---
# 88 caracteres: sweet spot de legibilidade
line-length = 88

# --- Target Versions ---
# Versões Python suportadas (determina sintaxe permitida)
target-version = ['py38', 'py39', 'py310', 'py311']

# --- Include/Exclude ---
# Arquivos Python a formatar
include = '\.pyi?$'

# Diretórios e arquivos a ignorar
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | \.egg-info
)/
'''

# ==================== ISORT (Import Sorter) ====================
[tool.isort]
# isort: Organiza imports automaticamente (PEP 8 compliant)

# --- Profile ---
# Compatível com black (evita conflitos)
profile = "black"

# --- Line Length ---
line_length = 88

# --- Grouping ---
# Grupos de import: stdlib → third-party → first-party → local
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

# Adicionar linha entre cada grupo
lines_after_imports = 2

# --- Multi-line ---
# Modo de formatação para imports multi-linha (vertical hanging indent)
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# ==================== MYPY (Type Checker) ====================
[tool.mypy]
# mypy: Verificador de tipos estático para Python

# --- Python Version ---
python_version = "3.8"

# --- Strictness ---
# Nível de rigor na verificação de tipos (começando moderado)
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

# --- Type Annotations ---
# Exigir type hints em funções públicas (gradualmente)
disallow_untyped_defs = false  # Começar false, migrar para true
disallow_incomplete_defs = false
check_untyped_defs = true

# --- Imports ---
# Seguir imports mesmo sem stubs
follow_imports = "normal"
ignore_missing_imports = true

# --- Output ---
# Mostrar códigos de erro e contexto
show_error_codes = true
show_column_numbers = true
pretty = true

# ==================== PYTEST (Test Framework) ====================
[tool.pytest.ini_options]
# pytest: Framework de testes para Python

# --- Test Discovery ---
# Diretórios onde procurar testes
testpaths = ["tests"]

# Padrões de arquivos de teste
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# --- Output ---
# Mostrar output completo e colorido
addopts = [
    "-ra",  # Mostrar resumo de todos os resultados
    "-q",   # Quiet mode (menos verbose)
    "--strict-markers",  # Marcar testes com markers não registrados como erro
    "--tb=short",  # Traceback curto
    "--cov=.",  # Coverage do diretório atual
    "--cov-report=html",  # Relatório HTML
    "--cov-report=term-missing",  # Mostrar linhas sem cobertura
]

# --- Markers ---
# Markers customizados para categorizar testes
markers = [
    "slow: Testes lentos que podem ser pulados em CI rápido",
    "integration: Testes de integração que requerem recursos externos",
    "unit: Testes unitários rápidos e isolados",
]

# ==================== COVERAGE ====================
[tool.coverage.run]
# Coverage: Medir cobertura de código pelos testes

# --- Source ---
# Diretórios a medir cobertura
source = ["."]

# Arquivos a omitir
omit = [
    "tests/*",
    "setup.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
# --- Reporting ---
# Ignorar linhas com estes padrões
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# Precisão decimal no relatório
precision = 2

# Mostrar linhas faltando cobertura
show_missing = true
